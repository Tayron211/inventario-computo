name: Render 24/7 Keep-Alive

on:
  schedule:
    # Ejecuta cada 10 minutos para mantener a Render 100% activo sin hibernación
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Anti-Hibernación Render
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Ping a Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ivt.onrender.com/api/ping)
          echo "Render Ping Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Render está activo y respondiendo en tiempo real."
          else
            echo "⚠️ Render despertando, código HTTP: $STATUS"
          fi
