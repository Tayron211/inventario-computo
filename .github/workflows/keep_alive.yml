name: Render 24/7 Keep-Alive

on:
  schedule:
    # Programado cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Ping Continuo Anti-Hibernacion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Enviar Pings Continuos a Render (Buffer Anti-Retardo)
        run: |
          echo "Iniciando ciclo de pings externos hacia Render..."
          URL="https://ivt.onrender.com/api/ping"
          
          # Realizar 4 pings espaciados cada 120 segundos (cubre 6 minutos continuos)
          # Esto garantiza que Render reciba tráfico externo cada 2 minutos sin importar demoras de GitHub
          for i in {1..4}; do
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            HTTP_CODE=$(curl -s -m 25 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "[$TIMESTAMP] Ping $i/4 a $URL -> Código HTTP: $HTTP_CODE"
            
            if [ "$i" -lt 4 ]; then
              sleep 120
            fi
          done
          echo "Ciclo de mantenimiento activo finalizado con exito."
