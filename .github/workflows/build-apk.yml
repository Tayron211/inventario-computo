name: Compilar APK SysInventory

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generar Keystore de Firma Release Oficial
        run: |
          cd android/app
          rm -f release.jks
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias sysinventory \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass sysinventory2026 \
            -keypass sysinventory2026 \
            -dname "CN=SysInventory, OU=Sistemas, O=Autonoma, L=Lima, ST=Lima, C=PE"

      - name: Compilar APK Release Firmada
        run: |
          cd android
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../build_output.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "==================== LOG DE ERROR ===================="
            tail -n 120 ../build_output.log
            exit $BUILD_STATUS
          fi
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/SysInventory.apk

      - name: Subir log en caso de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_output.log

      - name: Guardar APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SysInventory-Android-APK
          path: dist-apk/SysInventory.apk
          retention-days: 60

      - name: Publicar Release con APK adjunto
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: app-v2.1.4
          name: "SysInventory Android App (v2.1.4 - Splash Minimalista & Descarga Universal)"
          body: |
            ### 📱 Aplicación Móvil Oficial de SysInventory para Android
            Esta versión está compilada en modo Release y firmada oficialmente para evitar falsos positivos de Google Play Protect.
            
            #### 📥 Instalación:
            1. Descarga el archivo adjunto **`SysInventory.apk`** en tu teléfono Android.
            2. Toca el archivo descargado para iniciar la instalación.
            3. ¡Listo! Se instalará limpiamente en tu teléfono.
          files: |
            dist-apk/SysInventory.apk
