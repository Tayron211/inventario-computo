<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#88001B"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#220008"/>
      <stop offset="100%" stop-color="#0A0003"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield / Chip Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#chipGrad)"/>
  <rect x="5" y="5" width="54" height="54" rx="13" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  
  <!-- Inner Core Plate -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#innerGrad)" stroke="#FF2D55" stroke-width="2"/>
  
  <!-- CPU Core Crystal -->
  <rect x="23" y="23" width="18" height="18" rx="4" fill="#FF2D55"/>
  <rect x="25.5" y="25.5" width="13" height="13" rx="3" fill="#FFFFFF"/>
  <path d="M28 28L36 36M36 28L28 36" stroke="#DC143C" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Circuit Connection Pins (Top, Bottom, Left, Right) -->
  <!-- Top Pins -->
  <line x1="22" y1="7" x2="22" y2="14" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="7" x2="32" y2="14" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="7" x2="42" y2="14" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <line x1="22" y1="50" x2="22" y2="57" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="57" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="42" y2="57" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Pins -->
  <line x1="7" y1="22" x2="14" y2="22" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="14" y2="32" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="7" y1="42" x2="14" y2="42" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Pins -->
  <line x1="50" y1="22" x2="57" y2="22" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="57" y2="32" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="57" y2="42" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
